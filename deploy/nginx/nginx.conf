worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    log_format json escape=json '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
                                '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
                                '"rt":$request_time,"urt":"$upstream_response_time","rid":"$req_id","ua":"$http_user_agent"}';
    access_log /var/log/nginx/access.log json;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 55m;   # = spring.servlet.multipart.max-request-size

    gzip on;
    gzip_types application/json application/problem+json text/plain text/css application/javascript;
    gzip_min_length 1024;

    # Mijoz yuborgan X-Request-Id bo'lmasa — nginx o'zi yaratadi; API shu qiymatni traceId sifatida ishlatadi
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # Edge rate limit zonalari conf.d/default.conf'da (env bilan sozlanadi: NGINX_API_RATE, NGINX_AUTH_RATE)
    limit_req_status 429;

    upstream usta_api {
        server api:8080;
        keepalive 32;
    }

    include /etc/nginx/conf.d/*.conf;
}
